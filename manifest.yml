app:
  id: ari:cloud:ecosystem::app/REPLACE_AFTER_FORGE_REGISTER
  runtime:
    name: nodejs24.x
modules:
  action:
    - key: get-change-context
      name: Get Change Context
      description: |
        Given a Jira issue key, return the connected change context from Teamwork Graph: linked pull requests, commits, builds, deployments, related Confluence pages and owners. Use when the user asks what a change touches or could break.
      actionVerb: GET
      function: getChangeContext
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: Jira issue key such as PAY-142.
    - key: score-release-risk
      name: Score Release Risk
      description: |
        Given a Jira project key and release version name, gather graph evidence for every issue in the release and return a deterministic 0-100 risk score, reasons and a pre-release checklist. Use when the user asks whether a release is safe to ship.
      actionVerb: GET
      function: scoreReleaseRisk
      inputs:
        versionName:
          title: Version name
          type: string
          required: true
          description: Jira release version name.
        projectKey:
          title: Project key
          type: string
          required: true
          description: Jira project key.
    - key: find-experts
      name: Find Experts
      description: |
        Given a Jira issue key, return the people and teams connected to the related code and documentation in Teamwork Graph. Use when the user asks who knows about a change or who should review it.
      actionVerb: GET
      function: findExperts
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: Jira issue key such as PAY-142.
    - key: generate-release-checklist
      name: Generate Release Checklist
      description: Use when a user needs an actionable pre-release checklist with evidence and suggested reviewers.
      actionVerb: GET
      function: generateReleaseChecklist
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: Jira project key such as PAY.
        versionName:
          title: Version name
          type: string
          required: true
          description: Release version such as 2.4.0.
  rovo:agent:
    - key: blast-radius-agent
      name: Blast Radius
      description: Understand release impact, decisions and experts.
      prompt: resource:agent-prompts;agent-prompt.txt
      followUpPrompt: Ask which unresolved risk the user wants to investigate next.
      conversationStarters:
        - What could PAY-142 break?
        - Score version 2.4.0 in project PAY.
        - Who knows about PAY-142 and what was already decided?
      actions:
        - get-change-context
        - score-release-risk
        - find-experts
        - generate-release-checklist
  rovo:mcp:
    - key: blast-radius-mcp
      name: Blast Radius
      tools:
        - get-change-context
        - score-release-risk
        - find-experts
        - generate-release-checklist
  jira:issuePanel:
    - key: blast-radius-panel
      resource: main
      render: native
      resolver:
        function: resolver
      title: Blast Radius
      icon: resource:icons;blast-radius.svg
  function:
    - key: getChangeContext
      handler: index.getChangeContext
    - key: scoreReleaseRisk
      handler: index.scoreReleaseRisk
    - key: findExperts
      handler: index.findExperts
    - key: generateReleaseChecklist
      handler: index.generateReleaseChecklist
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: agent-prompts
    path: prompts
  - key: icons
    path: static/icons
permissions:
  scopes:
    - read:jira-work
    - read:graph:issue:jira
    - read:graph:project:jira
    - read:graph:version:jira
    - read:graph:page:confluence
    - read:graph:user:atlassian
    - read:graph:team:atlassian
    - read:graph:pull-request:external
    - read:graph:commit:external
    - read:graph:deployment:external
    - read:graph:build:external
    - read:graph:priority:jira
    - read:graph:issue-status:jira
